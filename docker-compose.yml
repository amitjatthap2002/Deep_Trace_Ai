version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: deeptrace
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: deeptrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://deeptrace:password123@db:5432/deeptrace_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - JWT_SECRET=supersecretkey_change_in_production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-your_api_key_here}
    depends_on:
      - db
      - redis
      - minio

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://deeptrace:password123@db:5432/deeptrace_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-your_api_key_here}
    depends_on:
      - db
      - redis
      - minio
      - api

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
